# grafana-ingressroute.yml
# IngressRoute de Traefik para Grafana.
# Fuerza http->https para que el navegador use HTTP/2 (websecure) y evite el
# bug de "Transfer-Encoding: chunked" sobre HTTP/1.1 que dejaba la pestaña cargando.
# Acceso: https://grafana.k8s.orb.local  (cert por defecto de Traefik / self-signed)
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: monitoring
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Entrypoint web (HTTP): solo redirige a HTTPS
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-web
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`grafana.k8s.orb.local`)
      middlewares:
        - name: redirect-https
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
---
# Entrypoint websecure (HTTPS/HTTP2): sirve la app
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`grafana.k8s.orb.local`)
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
  tls: {}
